name: Review native iOS launch

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        required: true
      source_artifact_name:
        type: string
        required: true
      simulator_artifact_name:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  source-security:
    uses: ./.github/workflows/security.yml
  capture:
    name: Record native cold launch
    needs: source-security
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      MUWA_REVIEW_RUNTIME_VERSION: "27.0"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.source_artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: build/launch-source
      - name: Verify the compiled source snapshot
        run: |
          SOURCE_ZIP="$(find build/launch-source -name '*FULL-SOURCE.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d build/launch-source/native
          python3 tests/verify_native_snapshot.py build/launch-source/native/Repository
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.simulator_artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: build
      - name: Unpack the native Simulator app
        run: |
          mkdir -p build/PreviewDerivedData/Build/Products/Debug-iphonesimulator
          tar -xzf build/muwa-review-app.tar.gz -C build/PreviewDerivedData/Build/Products/Debug-iphonesimulator
      - name: Verify terminal signals and record the native launch
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then brew install tesseract; fi
          python3 tests/verify_home_frame.py --prepare-models
          python3 tests/RecorderSignalChecks.py
          export MUWA_LAUNCH_DEVICE="$(python3 tests/select_apple_review_devices.py --kind phone --open-gui --print-udid)"
          python3 tests/capture_launch_ios.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-launch-validation-${{ github.run_number }}
          path: build/previews/launch
          if-no-files-found: warn
