name: Check Telegram catalogue import
on:
  push:
    branches: [main, feat/muwa-native-build35]
    paths: ["backend/**", "tools/telegram-import/**", ".github/workflows/telegram-import.yml"]
  pull_request:
    paths: ["backend/**", "tools/telegram-import/**", ".github/workflows/telegram-import.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-security:
    uses: ./.github/workflows/security.yml
  checks:
    needs: source-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: muwa_audit
          POSTGRES_PASSWORD: muwa-fixture-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install media inspector and pinned importer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install ./tools/telegram-import
      - name: Check real media inspection, resumability and isolated storage credentials
        run: python -m unittest discover -s tools/telegram-import/tests -v
      - name: Check import transactions and existing backend contracts
        working-directory: backend
        run: npm ci && npm test
        env:
          MUWA_TEST_DATABASE_URL: postgres://postgres:muwa-fixture-only@localhost:5432/muwa_audit
