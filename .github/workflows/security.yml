name: Inspect source for secrets
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified local scanner
        shell: bash
        run: |
          set -euo pipefail
          SCANNER_ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$SCANNER_ARCHIVE"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $SCANNER_ARCHIVE" | sha256sum -c -
          tar -xzf "$SCANNER_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
      - name: Check history and source archives locally
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git . --config=.gitleaks.toml --log-opts='--all' --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --config=.gitleaks.toml --max-archive-depth=2 --redact=100 --no-banner
