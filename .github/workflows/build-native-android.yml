name: Build Native Android
on:
  push:
    branches: [main, feat/muwa-native-build35]
    paths:
      [
        "android/**",
        "tests/capture_launch_android.py",
        "tests/capture_android.py",
        ".github/workflows/build-native-android.yml",
      ]
  workflow_dispatch:
    inputs:
      record_launch_video:
        description: Record launch video on a runner with a stable emulator GPU
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-security:
    uses: ./.github/workflows/security.yml
  build:
    needs: source-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"
      - run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-Android-build41
          path: |
            android/app/build/outputs/apk
            android/app/build/reports
            android/app/build/outputs/mapping/release/mapping.txt
  review:
    needs: source-security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        screen:
          - { name: phone-small, size: "720x1280", density: "320" }
          - { name: phone-large, size: "1080x2400", density: "440" }
          - { name: tablet, size: "1600x2560", density: "240" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK for screen review
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Install emulator with download retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install emulator; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - name: Ensure native recording transport tools are available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          if ! tesseract --list-langs 2>/dev/null | grep -qx rus; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
          fi
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          # Use GLES for the headless screenrecord fixture. The emulator in the
          # preceding run went offline after its recording surface was released.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.screen.size }}
            adb shell wm density ${{ matrix.screen.density }}
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            gradle -p android :app:connectedDebugAndroidTest --stacktrace
            gradle -p android --stop
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            MUWA_ANDROID_OUTPUT=build/android-previews/${{ matrix.screen.name }} python3 tests/capture_android.py
            MUWA_ANDROID_OUTPUT=build/android-previews/${{ matrix.screen.name }} MUWA_ANDROID_LAUNCH_VIDEO=${{ inputs.record_launch_video && '1' || '0' }} python3 tests/capture_launch_android.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-Android-${{ matrix.screen.name }}-screenshots
          path: |
            build/android-previews
            android/app/build/reports/androidTests
