name: Build Native Android
on:
  push:
    branches: [main, feat/muwa-native-build35]
    paths:
      [
        "android/**",
        "tests/capture_launch_android.py",
        "tests/capture_android.py",
        "tests/android_review_device.py",
        "tests/AndroidReviewDeviceChecks.py",
        ".github/workflows/build-native-android.yml",
      ]
  workflow_dispatch:
    inputs:
      record_launch_video:
        description: Record launch video on a runner with a stable emulator GPU
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-security:
    uses: ./.github/workflows/security.yml
  build:
    needs: source-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"
      - run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-Android-build48
          path: |
            android/app/build/outputs/apk
            android/app/build/reports
            android/app/build/outputs/mapping/release/mapping.txt
  review:
    name: Review Android API ${{ matrix.device.api }} / ${{ matrix.device.name }}
    needs: source-security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Verified against Google's stable SDK index on 2026-10-04. Do not
        # silently select a preview or relabel overridden geometry as a phone.
        device:
          - { name: phone-small, api: "37.2", target: google_apis_ps16k, size: "720x1280", density: "320", pageSize: "16384", latest: true }
          - { name: phone-large, api: "37.2", target: google_apis_ps16k, size: "1080x2400", density: "440", pageSize: "16384", latest: true }
          - { name: tablet, api: "37.2", target: google_apis_ps16k, size: "1600x2560", density: "240", pageSize: "16384", latest: true }
          - { name: phone-large, api: "35", target: google_apis, size: "1080x2400", density: "440", pageSize: "4096", latest: false }
    env:
      MUWA_ANDROID_API: ${{ matrix.device.api }}
      MUWA_ANDROID_AVD_NAME: muwa-api${{ matrix.device.api }}-${{ matrix.device.name }}
      MUWA_ANDROID_SYSTEM_IMAGE: system-images;android-${{ matrix.device.api }};${{ matrix.device.target }};x86_64
      MUWA_ANDROID_SCREEN_SIZE: ${{ matrix.device.size }}
      MUWA_ANDROID_SCREEN_DENSITY: ${{ matrix.device.density }}
      MUWA_ANDROID_PAGE_SIZE: ${{ matrix.device.pageSize }}
      MUWA_ANDROID_OUTPUT: build/android-previews/api${{ matrix.device.api }}/${{ matrix.device.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK for screen review
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Google's current stable command-line tools 23.0. Older sdkmanager
          # versions resolve cmdline-tools;latest using an obsolete XML index.
          cmdline-tools-version: "16111833"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Use one current stable SDK device catalog for selection and AVD creation
        shell: bash
        run: |
          # setup-android and emulator-runner otherwise select different SDK
          # tool directories. A profile from one catalog may be unknown to the
          # other avdmanager. emulator-runner explicitly uses latest/bin.
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          root = Path(os.environ["ANDROID_HOME"]) / "cmdline-tools"
          tools = root / "16111833"
          assert (tools / "bin/avdmanager").is_file(), "Pinned SDK23 tools were not installed"
          assert "Pkg.Revision=23.0" in (tools / "source.properties").read_text(), "Unexpected command-line tools revision"
          latest = root / "latest"
          if latest.is_symlink(): latest.unlink()
          elif latest.exists(): shutil.rmtree(latest)
          latest.symlink_to(tools, target_is_directory=True)
          PY
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          python3 tests/android_review_device.py --verify-tools "$ANDROID_HOME/cmdline-tools/16111833" --output "$MUWA_ANDROID_OUTPUT/sdk-tools-verification.json"
      - name: Install emulator with download retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install emulator; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - name: Verify Google's stable SDK image availability
        shell: bash
        run: |
          args=(--api "$MUWA_ANDROID_API" --target "${{ matrix.device.target }}" --output "$MUWA_ANDROID_OUTPUT/sdk-availability.json")
          if [ "${{ matrix.device.latest }}" = "true" ]; then args+=(--require-latest); fi
          python3 tests/AndroidReviewDeviceChecks.py
          python3 tests/android_review_device.py "${args[@]}"
      - name: Select the newest actual SDK hardware profile
        id: android-profile
        shell: bash
        run: |
          kind=phone
          if [ "${{ matrix.device.name }}" = "tablet" ]; then kind=tablet; fi
          python3 tests/android_review_device.py --select-profile "$kind" --output "$MUWA_ANDROID_OUTPUT/avd-profile-selection.json"
      - name: Ensure native recording transport tools are available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          if ! tesseract --list-langs 2>/dev/null | grep -qx rus; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
          fi
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MUWA_ANDROID_PROFILE: ${{ steps.android-profile.outputs.profile }}
        with:
          api-level: ${{ matrix.device.api }}
          target: ${{ matrix.device.target }}
          channel: stable
          arch: x86_64
          profile: ${{ steps.android-profile.outputs.profile }}
          avd-name: ${{ env.MUWA_ANDROID_AVD_NAME }}
          emulator-boot-timeout: 600
          # Use GLES for the headless screenrecord fixture. The emulator in the
          # preceding run went offline after its recording surface was released.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          # sys.boot_completed can precede usable Binder services on API37.2.
          # Our bounded readiness check owns animation settings after startup.
          disable-animations: false
          script: |
            python3 tests/android_review_device.py --wait-ready --output "$MUWA_ANDROID_OUTPUT/boot-readiness.json"
            adb shell wm size ${{ matrix.device.size }}
            adb shell wm density ${{ matrix.device.density }}
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            gradle -p android :app:connectedDebugAndroidTest --stacktrace
            gradle -p android --stop
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            python3 tests/capture_android.py
            MUWA_ANDROID_LAUNCH_VIDEO=${{ inputs.record_launch_video && '1' || '0' }} python3 tests/capture_launch_android.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-Android-api${{ matrix.device.api }}-${{ matrix.device.name }}-screenshots
          path: |
            build/android-previews
            android/app/build/reports/androidTests
