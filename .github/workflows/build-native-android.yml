name: Build Native Android
on:
  push:
    branches: [main, feat/muwa-native-build35]
    paths: ['android/**', 'tests/capture_launch_android.py', 'tests/capture_android.py', '.github/workflows/build-native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Muwa-Android-build36
          path: |
            android/app/build/outputs/apk
            android/app/build/reports
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        screen:
          - {name: phone-small, size: '720x1280', density: '320'}
          - {name: phone-large, size: '1080x2400', density: '440'}
          - {name: tablet, size: '1600x2560', density: '240'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK for screen review
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install emulator with download retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install emulator; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.screen.size }}
            adb shell wm density ${{ matrix.screen.density }}
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            gradle -p android :app:connectedDebugAndroidTest --stacktrace
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            MUWA_ANDROID_OUTPUT=build/android-previews/${{ matrix.screen.name }} python3 tests/capture_launch_android.py
            MUWA_ANDROID_OUTPUT=build/android-previews/${{ matrix.screen.name }} python3 tests/capture_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Muwa-Android-${{ matrix.screen.name }}-screenshots
          path: |
            build/android-previews
            android/app/build/reports/androidTests
