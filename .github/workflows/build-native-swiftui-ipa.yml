name: Build Native SwiftUI IPA

on:
  push:
    branches: [main, codex/muwa-build30-ai-subtitles, feat/muwa-native-build35]
    paths:
      [
        "source-base/**",
        "native-patches/**",
        "branding/**",
        "backend/**",
        "admin-panel/**",
        "scripts/**",
        "tests/**",
        "!tests/capture_carplay.py",
        "!tests/locate_carplay_app.swift",
        "!tests/capture_launch_android.py",
        "!tests/capture_android.py",
        "!tests/android_review_device.py",
        "!tests/AndroidReviewDeviceChecks.py",
        "!tests/verify_native_snapshot.py",
        ".github/workflows/build-native-swiftui-ipa.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: muwa-native-ios-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-security:
    uses: ./.github/workflows/security.yml
  backend:
    needs: source-security
    name: Check backend contracts and PostgreSQL transactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: muwa_audit
          POSTGRES_PASSWORD: muwa-fixture-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact Apple runtime and device selection
        run: python3 tests/AppleReviewDeviceChecks.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-panel/package-lock.json
      - run: npm ci && npm test && npm run typecheck && npm run build && npm run test:runtime
        working-directory: backend
        env:
          MUWA_TEST_DATABASE_URL: postgres://postgres:muwa-fixture-only@localhost:5432/muwa_audit
      - run: npm ci && npm run build
        working-directory: admin-panel

  build:
    needs: [backend, source-security]
    name: Build native SwiftUI unsigned IPA
    # Official GitHub preview runner; select the stable Xcode 27.0 toolchain,
    # not its separately installed Xcode 27.1/27.2 preview toolchains.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      MUWA_REVIEW_RUNTIME_VERSION: "27.0"
      MUWA_REQUESTED_DEVICE: iPhone 18 Pro Max
      MUWA_REQUESTED_IOS: "27.0"
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the selected stable iOS 27 SDK
        shell: bash
        run: |
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          xcodebuild -version
          xcrun simctl list runtimes --json

      - name: Prepare native source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src build
          mkdir -p build-src build

          SOURCE_ZIP="$PWD/source-base/MuwaNativeBase.zip"
          EXPECTED_SOURCE_SHA="f07bce80d5b9b39583a8bce19f3e3b71caed205332649f13ccb45a8b28997f84"
          EXPECTED_ICON_SHA="7d6e3af660633d8b76112b33813762570531a212f62a6af4650a1cf11ea295ba"
          EXPECTED_MARK_SHA="50913b3364be9430bc8efc535f6c1bc03bdf056576092e929a6b48cc28e86aec"

          # Use the verified source committed to this repository for reproducible builds.
          test -f "$SOURCE_ZIP"
          echo "$EXPECTED_SOURCE_SHA  $SOURCE_ZIP" | shasum -a 256 -c -
          unzip -q "$SOURCE_ZIP" -d build-src

          ROOT="$PWD/build-src/MuwaNasheedsNative"
          test -f "$ROOT/MuwaNasheeds.xcodeproj/project.pbxproj"
          test -f "$ROOT/MuwaNasheeds.xcodeproj/xcshareddata/xcschemes/MuwaNasheeds.xcscheme"

          # Apply device layout fixes after verifying the immutable source archive.
          test -f "$PWD/native-patches/MiniPlayerView.swift"
          test -f "$PWD/native-patches/FullPlayerView.swift"
          test -f "$PWD/native-patches/PremiumView.swift"
          test -f "$PWD/native-patches/BottomBar.swift"
          test -f "$PWD/native-patches/AdaptiveLayout.swift"
          test -f "$PWD/native-patches/RootView.swift"
          test -f "$PWD/native-patches/HomeView.swift"
          test -f "$PWD/native-patches/TrackRow.swift"
          test -f "$PWD/native-patches/QueueView.swift"
          test -f "$PWD/native-patches/Theme.swift"
          test -f "$PWD/native-patches/LibraryView.swift"
          test -f "$PWD/native-patches/LibraryDetailView.swift"
          test -f "$PWD/native-patches/LibraryStore.swift"
          test -f "$PWD/native-patches/PlayerManager.swift"
          test -f "$PWD/native-patches/ArtworkView.swift"
          test -f "$PWD/native-patches/LaunchBackgroundContents.json"
          cp "$PWD/native-patches/MiniPlayerView.swift" "$ROOT/Sources/Views/Components/MiniPlayerView.swift"
          cp "$PWD/native-patches/FullPlayerView.swift" "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          cp "$PWD/native-patches/PremiumView.swift" "$ROOT/Sources/Views/Premium/PremiumView.swift"
          cp "$PWD/native-patches/BottomBar.swift" "$ROOT/Sources/Views/Components/BottomBar.swift"
          cp "$PWD/native-patches/AdaptiveLayout.swift" "$ROOT/Sources/Theme/AdaptiveLayout.swift"
          cp "$PWD/native-patches/RootView.swift" "$ROOT/Sources/App/RootView.swift"
          cp "$PWD/native-patches/HomeView.swift" "$ROOT/Sources/Views/Home/HomeView.swift"
          cp "$PWD/native-patches/ProfileView.swift" "$ROOT/Sources/Views/Profile/ProfileView.swift"
          cp "$PWD/native-patches/PremiumManager.swift" "$ROOT/Sources/Services/PremiumManager.swift"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Muwa" "$ROOT/Info.plist"
          cp "$PWD/native-patches/TrackRow.swift" "$ROOT/Sources/Views/Components/TrackRow.swift"
          cp "$PWD/native-patches/QueueView.swift" "$ROOT/Sources/Views/Player/QueueView.swift"
          cp "$PWD/native-patches/Theme.swift" "$ROOT/Sources/Theme/Theme.swift"
          cp "$PWD/native-patches/LibraryView.swift" "$ROOT/Sources/Views/Library/LibraryView.swift"
          cp "$PWD/native-patches/LibraryDetailView.swift" "$ROOT/Sources/Views/Library/LibraryDetailView.swift"
          cp "$PWD/native-patches/LibraryStore.swift" "$ROOT/Sources/Services/LibraryStore.swift"
          cp "$PWD/native-patches/PlayerManager.swift" "$ROOT/Sources/Services/PlayerManager.swift"
          cp "$PWD/native-patches/ArtworkView.swift" "$ROOT/Sources/Views/Components/ArtworkView.swift"
          cp "$PWD/native-patches/SubtitleModels.swift" "$ROOT/Sources/Models/SubtitleModels.swift"
          cp "$PWD/native-patches/SubtitleManager.swift" "$ROOT/Sources/Services/SubtitleManager.swift"
          cp "$PWD/native-patches/PlayerSubtitleOverlay.swift" "$ROOT/Sources/Views/Player/PlayerSubtitleOverlay.swift"

          mkdir -p "$ROOT/Resources/Assets.xcassets/LaunchBackground.colorset"
          cp "$PWD/native-patches/LaunchBackgroundContents.json" "$ROOT/Resources/Assets.xcassets/LaunchBackground.colorset/Contents.json"
          cp "$PWD/native-patches/MuwaNasheedsApp.swift" "$ROOT/Sources/App/MuwaNasheedsApp.swift"
          grep -Fq 'MPNowPlayingInfoCenter.default().nowPlayingInfo = nil' "$ROOT/Sources/Services/PlayerManager.swift"
          grep -Fq 'resumeSavedPlayback' "$ROOT/Sources/Services/PlayerManager.swift"
          grep -Fq 'muwa.native.resume.track' "$ROOT/Sources/Services/PlayerManager.swift"
          grep -Fq 'persistResumeCandidate(force: true)' "$ROOT/Sources/Services/PlayerManager.swift"
          grep -Fq 'player.dismissResumeCandidate()' "$ROOT/Sources/Views/Home/HomeView.swift"
          ! grep -Fq 'ScreenHeader(title: "Главная"' "$ROOT/Sources/Views/Home/HomeView.swift"
          ! grep -Fq 'HomeScrollOffsetKey' "$ROOT/Sources/Views/Home/HomeView.swift"
          grep -Fq 'NavigationStack {' "$ROOT/Sources/Views/Home/HomeView.swift"
          grep -Fq '.navigationTitle("Главная")' "$ROOT/Sources/Views/Home/HomeView.swift"
          grep -Fq '.navigationBarTitleDisplayMode(.large)' "$ROOT/Sources/Views/Home/HomeView.swift"
          grep -Fq '.toolbarBackground(.hidden, for: .navigationBar)' "$ROOT/Sources/Views/Home/HomeView.swift"
          grep -Fq 'private enum ArtworkGestureAxis: Equatable' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'artworkGestureActive' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq '.highPriorityGesture(' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'finishArtworkPaging(' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'finishArtworkVerticalDrag(' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'leftEdgeTravel' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'rightEdgeTravel' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'let currentScale = 1 - (0.28 * eased)' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'let incomingScale = 0.72 + (0.28 * eased)' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'guard !artworkGestureActive else' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'NavigationLink(value: destination)' "$ROOT/Sources/Views/Library/LibraryView.swift"
          grep -Fq 'if abs(delta) > 1' "$ROOT/Sources/Theme/AdaptiveLayout.swift"
          grep -Fq 'return max(0, width - horizontalPadding * 2)' "$ROOT/Sources/Theme/AdaptiveLayout.swift"
          grep -Fq 'safeLeadingInset' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'safeTrailingInset' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'layout.isLandscape ? .horizontal : []' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'MuwaArtworkLoader' "$ROOT/Sources/Views/Components/ArtworkView.swift"
          grep -Fq 'startSleepTimer(minutes:' "$ROOT/Sources/Services/PlayerManager.swift"
          grep -Fq 'sleepAfterCurrentTrackEnds()' "$ROOT/Sources/Services/PlayerManager.swift"
          grep -Fq 'prefetchFollowingTrack(after:' "$ROOT/Sources/Services/PlayerManager.swift"
          grep -Fq 'await asset.load(.isPlayable)' "$ROOT/Sources/Services/PlayerManager.swift"
          grep -Fq 'Таймер сна' "$ROOT/Sources/Views/Player/FullPlayerView.swift"

          python3 scripts/prepare_native_extras.py "$ROOT"
          python3 tests/check_native_registration.py "$ROOT"

          # iOS owns the brief system launch phase. The app then mounts Home
          # immediately; the brand mark animates in its toolbar.
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$ROOT/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$ROOT/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen:UIColorName string LaunchBackground" "$ROOT/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$ROOT/Info.plist")" = "LaunchBackground"

          # Allow ProMotion-capable iPhones to render above 60 Hz. iOS still
          # controls the actual adaptive refresh rate based on hardware/system state.
          /usr/libexec/PlistBuddy -c "Delete :CADisableMinimumFrameDurationOnPhone" "$ROOT/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$ROOT/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$ROOT/Info.plist")" = "true"

          ICON_PATH="$ROOT/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          MARK_PATH="$ROOT/Resources/Assets.xcassets/AppMark.imageset/AppMark.png"
          echo "$EXPECTED_ICON_SHA  $ICON_PATH" | shasum -a 256 -c -
          echo "$EXPECTED_MARK_SHA  $MARK_PATH" | shasum -a 256 -c -

          WIDTH="$(sips -g pixelWidth "$ICON_PATH" | awk '/pixelWidth/{print $2}')"
          HEIGHT="$(sips -g pixelHeight "$ICON_PATH" | awk '/pixelHeight/{print $2}')"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

          sed -i '' 's/CURRENT_PROJECT_VERSION = 8;/CURRENT_PROJECT_VERSION = 44;/g' "$ROOT/MuwaNasheeds.xcodeproj/project.pbxproj"
          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Package full source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/full-source
          mkdir -p build/full-source/Repository

          ditto "$SOURCE_ROOT" build/full-source/MuwaNasheedsNative
          # Preserve the complete tracked repository, including Android and all
          # workflows, without accidentally packaging credentials or build caches.
          git archive HEAD | tar -x -C build/full-source/Repository

          cat > build/full-source/README-SOURCE.txt <<EOF
          Muwa — Full Source Archive
          Version: 1.4.0
          Build: 44
          Commit: ${GITHUB_SHA}

          Contents:
          - MuwaNasheedsNative/ — complete assembled Xcode project
          - Repository/ — complete tracked repository at the commit above
          - Repository/android/ — native Kotlin/Compose/Media3 application
          - Repository/native-patches/ — replacements used to assemble the iOS project
          - Repository/backend/ and Repository/admin-panel/ — server and remote panel source
          - Repository/tests/ and Repository/.github/workflows/ — checks and build tooling
          - Repository/docs/ — architecture, deployment status and device limitations

          Open:
          MuwaNasheedsNative/MuwaNasheeds.xcodeproj
          Android: Repository/android/ (JDK 17, Gradle 8.10.2, Android SDK 35)

          Notes:
          - This archive contains source code and project resources, not only the IPA.
          - The project is the same assembled source tree used for the build-44 IPA.
          - Application identity is preserved; the owner chose a fresh Beget database.
          - See Repository/docs for production deployment verification and device limitations.
          - Audio and artwork use authenticated Beget storage and are not bundled as local media.
          EOF

          find build/full-source -name '.DS_Store' -delete
          (
            cd build/full-source
            /usr/bin/zip -qry -y ../Muwa-v1.4.0-build44-FULL-SOURCE.zip .
          )
          shasum -a 256 build/Muwa-v1.4.0-build44-FULL-SOURCE.zip \
            | tee build/Muwa-v1.4.0-build44-FULL-SOURCE.zip.sha256

      - name: Upload full source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Muwa-Full-Source-${{ github.run_number }}
          path: |
            build/Muwa-v1.4.0-build44-FULL-SOURCE.zip
            build/Muwa-v1.4.0-build44-FULL-SOURCE.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Xcode environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project "$SOURCE_ROOT/MuwaNasheeds.xcodeproj" -scheme MuwaNasheeds -list

      - name: Regression checks for playlists and layout
        run: python3 tests/run_checks.py "$SOURCE_ROOT"

      - name: Build Release for physical iOS device
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild             -project "$SOURCE_ROOT/MuwaNasheeds.xcodeproj"             -scheme MuwaNasheeds             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$PWD/build/DerivedData"             MARKETING_VERSION='1.4.0'             CURRENT_PROJECT_VERSION='44'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=''             DEVELOPMENT_TEAM=''             build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD_NO="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"

          test "$BUNDLE_ID" = "app.muwa.nasheeds"
          test "$VERSION" = "1.4.0"
          test "$BUILD_NO" = "44"
          test -x "$APP_PATH/$EXECUTABLE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$APP_PATH/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$APP_PATH/Info.plist")" = "LaunchBackground"

          lipo -info "$APP_PATH/$EXECUTABLE" | tee build/architecture.txt
          lipo -info "$APP_PATH/$EXECUTABLE" | grep -q arm64

          rm -rf build/package
          mkdir -p build/package/Payload
          ditto "$APP_PATH" "build/package/Payload/Muwa.app"
          find build/package/Payload -type d -name _CodeSignature -prune -exec rm -rf '{}' +
          find build/package/Payload -type f -name embedded.mobileprovision -delete

          (
            cd build/package
            /usr/bin/zip -qry -y ../Muwa-v1.4.0-build44-native-unsigned.ipa Payload
          )

          shasum -a 256 build/Muwa-v1.4.0-build44-native-unsigned.ipa | tee build/Muwa-v1.4.0-build44-native-unsigned.ipa.sha256

          cat > build/build-info.json <<EOF
          {
            "app": "Muwa",
            "bundle_id": "$BUNDLE_ID",
            "version": "$VERSION",
            "build": "$BUILD_NO",
            "architecture": "arm64",
            "swiftui_native": true,
            "webview": false,
            "signed": false,
            "source_commit": "${GITHUB_SHA}",
            "source_archive_sha256": "f07bce80d5b9b39583a8bce19f3e3b71caed205332649f13ccb45a8b28997f84",
            "audit_fixes": ["named-playlist-actions", "stable-migration", "empty-queue-persistence", "library-scroll-clearance", "mini-player-morph-coordinates", "compact-landscape-player", "independent-startup-loading", "fresh-now-playing-cleanup", "collapsing-transparent-home-header", "next-launch-resume-candidate", "compact-dismissible-resume-card", "restrained-cover-swipe", "relative-scroll-header-collapse", "library-quick-navigation-links", "landscape-full-width-content", "landscape-edge-to-edge-player-safe-controls", "black-system-launch-screen", "branded-artwork-loader", "sleep-timer", "next-track-prefetch", "home-header-real-scroll-collapse", "interactive-cover-paging-carousel", "native-ios-home-title-collapse", "cover-shrink-slide-replacement", "artwork-axis-gesture-lock", "edge-aware-cover-transition", "isolated-playback-clock", "coalesced-scrubbing", "decoded-artwork-cache", "background-thumbnail-blur", "animation-completion-paging", "lightweight-ambient-background", "additive-ai-subtitles-v2", "original-first-translations", "word-highlight-reader"],
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Muwa-Native-IPA-${{ github.run_number }}
          path: |
            build/Muwa-v1.4.0-build44-native-unsigned.ipa
            build/Muwa-v1.4.0-build44-native-unsigned.ipa.sha256
            build/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Build review fixtures for iOS Simulator
        run: |
          python3 tests/prepare_previews.py "$SOURCE_ROOT"
          set -o pipefail
          xcodebuild -project "$SOURCE_ROOT/MuwaNasheeds.xcodeproj" -scheme MuwaNasheeds -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/build/PreviewDerivedData" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/simulator.log

      - name: Package simulator app for independent review jobs
        run: tar -czf build/muwa-review-app.tar.gz -C build/PreviewDerivedData/Build/Products/Debug-iphonesimulator .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Muwa-build44-simulator-${{ github.run_id }}
          path: build/muwa-review-app.tar.gz
          if-no-files-found: error

      - name: Upload Xcode log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Muwa-build-log-${{ github.run_number }}
          path: |
            build/xcodebuild.log
            build/simulator.log
            build/architecture.txt
          if-no-files-found: ignore
          retention-days: 14

  review:
    name: Review iOS ${{ matrix.device }}
    needs: build
    # Official GitHub preview runner; select the stable Xcode 27.0 toolchain,
    # not its separately installed Xcode 27.1/27.2 preview toolchains.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      MUWA_REVIEW_RUNTIME_VERSION: "27.0"
      MUWA_REQUESTED_DEVICE: iPhone 18 Pro Max
      MUWA_REQUESTED_IOS: "27.0"
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [phone, large-phone, tablet, small-tablet]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the selected stable iOS 27 SDK
        shell: bash
        run: |
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          xcodebuild -version
          xcrun simctl list runtimes --json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Muwa-build44-simulator-${{ github.run_id }}
          path: build
      - name: Unpack simulator app
        run: |
          mkdir -p build/PreviewDerivedData/Build/Products/Debug-iphonesimulator
          tar -xzf build/muwa-review-app.tar.gz -C build/PreviewDerivedData/Build/Products/Debug-iphonesimulator
      - name: Capture native screens
        env:
          MUWA_REVIEW_DEVICE: ${{ matrix.device }}
        run: python3 tests/capture_previews.py
      - name: Verify Home while session restoration is pending
        if: matrix.device == 'phone'
        run: |
          python3 tests/RecorderSignalChecks.py
          export MUWA_LAUNCH_DEVICE="$(python3 tests/select_apple_review_devices.py --kind phone --print-udid)"
          python3 tests/capture_launch_ios.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-build44-${{ matrix.device }}-screenshots
          # Keep individual downloadable archives below the attachment limit on
          # large iPads. All files remain unmodified native Simulator captures.
          path: |
            build/previews/*home*.png
            build/previews/*search.png
            build/previews/*library*.png
            build/previews/*playlist-create.png
            build/previews/*.json
            build/previews/*-device.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-build44-${{ matrix.device }}-player-screenshots
          path: |
            build/previews/*player.png
            build/previews/*landscape.png
            build/previews/*queue*.png
            build/previews/*ai*.png
            build/previews/*cached-backdrop.png
            build/previews/*-check.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-build44-${{ matrix.device }}-account-screenshots
          path: |
            build/previews/*profile.png
            build/previews/*settings.png
            build/previews/*premium.png
            build/previews/*promo.png
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.device == 'phone'
        with:
          name: Muwa-build44-phone-launch-review
          path: build/previews/launch
          if-no-files-found: error

  carplay-review:
    name: Review CarPlay external display
    needs: build
    uses: ./.github/workflows/review-carplay.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_artifact_name: Muwa-Full-Source-${{ github.run_number }}

  native-interactions:
    name: Verify native actions and rotation / ${{ matrix.device }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        device: [large-phone, tablet, small-tablet]
    # Official GitHub preview runner; select the stable Xcode 27.0 toolchain,
    # not its separately installed Xcode 27.1/27.2 preview toolchains.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      MUWA_REVIEW_RUNTIME_VERSION: "27.0"
      MUWA_REQUESTED_DEVICE: iPhone 18 Pro Max
      MUWA_REQUESTED_IOS: "27.0"
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the selected stable iOS 27 SDK
        shell: bash
        run: |
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          xcodebuild -version
          xcrun simctl list runtimes --json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Muwa-Full-Source-${{ github.run_number }}
          path: build/interaction-source
      - name: Prepare disposable native UI test target
        run: |
          unzip -q build/interaction-source/*FULL-SOURCE.zip -d build/interaction-source/native
          python3 tests/verify_native_snapshot.py build/interaction-source/native/Repository
          python3 tests/prepare_previews.py build/interaction-source/native/MuwaNasheedsNative
          gem install --user-install xcodeproj --version 1.27.0 --no-document
          ruby tests/prepare_interaction_tests.rb build/interaction-source/native/MuwaNasheedsNative
      - name: Exercise real row dragging and playlist creation
        run: |
          python3 tests/select_apple_review_devices.py --kind "${{ matrix.device }}" --open-gui --output build/interaction-devices.json
          DEVICE_ID="$(python3 tests/select_apple_review_devices.py --kind "${{ matrix.device }}" --print-udid)"
          set -o pipefail
          xcodebuild -project build/interaction-source/native/MuwaNasheedsNative/MuwaNasheeds.xcodeproj -scheme MuwaInteractions -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/InteractionDerivedData -resultBundlePath build/interactions.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/interactions.log
      - name: Export actual interaction screenshots
        if: always()
        run: |
          if test -d build/interactions.xcresult; then
            xcrun xcresulttool export attachments --path build/interactions.xcresult --output-path build/interaction-screenshots
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-build44-native-interactions-${{ matrix.device }}
          path: |
            build/interactions.xcresult
            build/interactions.log
            build/interaction-devices.json
            build/interaction-screenshots
          if-no-files-found: error

      - name: Upload rotation screenshots and device evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-build44-rotation-screenshots-${{ matrix.device }}
          path: |
            build/interaction-screenshots
            build/interaction-devices.json
          if-no-files-found: error
