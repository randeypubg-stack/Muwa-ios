name: Build Native SwiftUI IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muwa-native-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build native SwiftUI unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare native source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src build
          mkdir -p build-src build

          SOURCE_URL="https://muwa-app.floot.app/_cdn/static/72ba7504-6be6-45bc-a691-02a771940d19-muwa-native-source-v8-icon-synced-xcode-rc.zip"
          SOURCE_ZIP="$PWD/build/muwa-native-source.zip"
          EXPECTED_SOURCE_SHA="f07bce80d5b9b39583a8bce19f3e3b71caed205332649f13ccb45a8b28997f84"
          EXPECTED_ICON_SHA="ac533d8fe8db72557b1c2a27f8986895dc9edb387709141e632dad82b68a9af5"

          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o "$SOURCE_ZIP"
          echo "$EXPECTED_SOURCE_SHA  $SOURCE_ZIP" | shasum -a 256 -c -
          unzip -q "$SOURCE_ZIP" -d build-src

          ROOT="$PWD/build-src/MuwaNasheedsNative"
          test -f "$ROOT/MuwaNasheeds.xcodeproj/project.pbxproj"
          test -f "$ROOT/MuwaNasheeds.xcodeproj/xcshareddata/xcschemes/MuwaNasheeds.xcscheme"

          # Apply device layout fixes after verifying the immutable source archive.
          test -f "$PWD/native-patches/MiniPlayerView.swift"
          test -f "$PWD/native-patches/FullPlayerView.swift"
          test -f "$PWD/native-patches/PremiumView.swift"
          test -f "$PWD/native-patches/BottomBar.swift"
          test -f "$PWD/native-patches/AdaptiveLayout.swift"
          test -f "$PWD/native-patches/RootView.swift"
          test -f "$PWD/native-patches/HomeView.swift"
          test -f "$PWD/native-patches/TrackRow.swift"
          test -f "$PWD/native-patches/QueueView.swift"
          test -f "$PWD/native-patches/Theme.swift"
          test -f "$PWD/native-patches/LibraryView.swift"
          cp "$PWD/native-patches/MiniPlayerView.swift" "$ROOT/Sources/Views/Components/MiniPlayerView.swift"
          cp "$PWD/native-patches/FullPlayerView.swift" "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          cp "$PWD/native-patches/PremiumView.swift" "$ROOT/Sources/Views/Premium/PremiumView.swift"
          cp "$PWD/native-patches/BottomBar.swift" "$ROOT/Sources/Views/Components/BottomBar.swift"
          cp "$PWD/native-patches/AdaptiveLayout.swift" "$ROOT/Sources/Theme/AdaptiveLayout.swift"
          cp "$PWD/native-patches/RootView.swift" "$ROOT/Sources/App/RootView.swift"
          cp "$PWD/native-patches/HomeView.swift" "$ROOT/Sources/Views/Home/HomeView.swift"
          cp "$PWD/native-patches/TrackRow.swift" "$ROOT/Sources/Views/Components/TrackRow.swift"
          cp "$PWD/native-patches/QueueView.swift" "$ROOT/Sources/Views/Player/QueueView.swift"
          cp "$PWD/native-patches/Theme.swift" "$ROOT/Sources/Theme/Theme.swift"
          cp "$PWD/native-patches/LibraryView.swift" "$ROOT/Sources/Views/Library/LibraryView.swift"
          grep -Fq '.frame(height: 58)' "$ROOT/Sources/Views/Components/MiniPlayerView.swift"
          grep -Fq 'struct MorphingPlayerView' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'PremiumView(compact: true)' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'var compact = false' "$ROOT/Sources/Views/Premium/PremiumView.swift"
          grep -Fq 'DragGesture(minimumDistance: 6' "$ROOT/Sources/Views/Components/BottomBar.swift"
          grep -Fq '.frame(height: 62)' "$ROOT/Sources/Views/Components/BottomBar.swift"
          grep -Fq '.frame(height: 52)' "$ROOT/Sources/Views/Components/BottomBar.swift"
          grep -Fq 'cornerRadius: 28' "$ROOT/Sources/Views/Components/BottomBar.swift"
          grep -Fq 'var viewportWidth' "$ROOT/Sources/Theme/AdaptiveLayout.swift"
          grep -Fq 'UIDevice.current.userInterfaceIdiom' "$ROOT/Sources/Theme/AdaptiveLayout.swift"
          grep -Fq 'predictedEndTranslation.height' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'expansionDragGesture(' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'let playerWidth = lerp' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq '@State private var playerExpansion' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'MorphingPlayerView(' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'rotationEffect(.degrees(90))' "$ROOT/Sources/Views/Components/TrackRow.swift"
          grep -Fq 'togglePlaylistAction' "$ROOT/Sources/Views/Home/HomeView.swift"
          grep -Fq 'presentationDragIndicator(.hidden)' "$ROOT/Sources/Views/Player/QueueView.swift"
          grep -Fq 'library.removeFromQueue(track)' "$ROOT/Sources/Views/Player/QueueView.swift"
          grep -Fq '.draggable(track.id)' "$ROOT/Sources/Views/Player/QueueView.swift"
          grep -Fq 'repeatForever(autoreverses: true)' "$ROOT/Sources/Theme/Theme.swift"
          grep -Fq 'Circle()' "$ROOT/Sources/Theme/Theme.swift"
          grep -Fq '.drawingGroup(opaque: false, colorMode: .linear)' "$ROOT/Sources/Theme/Theme.swift"
          grep -Fq 'AppBackground()' "$ROOT/Sources/Views/Library/LibraryView.swift"
          grep -Fq 'MiniPlayerView(openPlayer: expandPlayer)' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'allowsHitTesting(progress > 0.004)' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'let chromeDrop' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'max(safeBottom - 5, 11)' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'padding(.bottom, layout.isPhone ? 6 : 0)' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'padding(.horizontal, layout.isPhone ? 4 : 0)' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'offset(y: layout.isPhone ? -2 : 0)' "$ROOT/Sources/App/RootView.swift"
          grep -Fq 'return 5' "$ROOT/Sources/Theme/AdaptiveLayout.swift"
          grep -Fq 'fullSurfaceHeight' "$ROOT/Sources/Views/Player/FullPlayerView.swift"
          grep -Fq 'safeTopInset + 28' "$ROOT/Sources/Views/Player/FullPlayerView.swift"

          # Allow ProMotion-capable iPhones to render above 60 Hz. iOS still
          # controls the actual adaptive refresh rate based on hardware/system state.
          /usr/libexec/PlistBuddy -c "Delete :CADisableMinimumFrameDurationOnPhone" "$ROOT/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$ROOT/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$ROOT/Info.plist")" = "true"

          ICON_PATH="$ROOT/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          MARK_PATH="$ROOT/Resources/Assets.xcassets/AppMark.imageset/AppMark.png"
          echo "$EXPECTED_ICON_SHA  $ICON_PATH" | shasum -a 256 -c -
          echo "$EXPECTED_ICON_SHA  $MARK_PATH" | shasum -a 256 -c -

          WIDTH="$(sips -g pixelWidth "$ICON_PATH" | awk '/pixelWidth/{print $2}')"
          HEIGHT="$(sips -g pixelHeight "$ICON_PATH" | awk '/pixelHeight/{print $2}')"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Xcode environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project "$SOURCE_ROOT/MuwaNasheeds.xcodeproj" -scheme MuwaNasheeds -list

      - name: Build Release for physical iOS device
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild             -project "$SOURCE_ROOT/MuwaNasheeds.xcodeproj"             -scheme MuwaNasheeds             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$PWD/build/DerivedData"             MARKETING_VERSION='1.4.0'             CURRENT_PROJECT_VERSION='18'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=''             DEVELOPMENT_TEAM=''             build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD_NO="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"

          test "$BUNDLE_ID" = "app.muwa.nasheeds"
          test "$VERSION" = "1.4.0"
          test "$BUILD_NO" = "18"
          test -x "$APP_PATH/$EXECUTABLE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$APP_PATH/Info.plist")" = "true"

          lipo -info "$APP_PATH/$EXECUTABLE" | tee build/architecture.txt
          lipo -info "$APP_PATH/$EXECUTABLE" | grep -q arm64

          rm -rf build/package
          mkdir -p build/package/Payload
          ditto "$APP_PATH" "build/package/Payload/Muwa Nasheeds.app"
          find build/package/Payload -type d -name _CodeSignature -prune -exec rm -rf '{}' +
          find build/package/Payload -type f -name embedded.mobileprovision -delete

          (
            cd build/package
            /usr/bin/zip -qry -y ../Muwa-Nasheeds-v1.4.0-build18-cornerclearance-unsigned.ipa Payload
          )

          shasum -a 256 build/Muwa-Nasheeds-v1.4.0-build18-cornerclearance-unsigned.ipa | tee build/Muwa-Nasheeds-v1.4.0-build18-cornerclearance-unsigned.ipa.sha256

          cat > build/build-info.json <<EOF
          {
            "app": "Muwa Nasheeds",
            "bundle_id": "$BUNDLE_ID",
            "version": "$VERSION",
            "build": "$BUILD_NO",
            "architecture": "arm64",
            "swiftui_native": true,
            "webview": false,
            "signed": false,
            "source_commit": "${GITHUB_SHA}",
            "source_archive_sha256": "f07bce80d5b9b39583a8bce19f3e3b71caed205332649f13ccb45a8b28997f84",
            "layout_fix": "mini-player-geometry-and-full-player-width",
            "premium_fix": "compact-sheet-pinned-close",
            "bottom_bar_fix": "scrub-navigation",
            "device_layout_fix": "idiom-orientation-physical-viewport-clamp",
            "player_dismiss_fix": "vertical-swipe-to-mini-player",
            "mini_player_fix": "strict-fixed-height-no-geometry-reader",
            "track_rows_fix": "full-row-tap-vertical-menu-playlist-queue",
            "queue_ui_fix": "muwa-header-delete-short-drag-handle-full-row-tap",
            "player_transition_fix": "single-persistent-interactive-player-container",
            "player_animation_target": "adaptive-promotion-up-to-120hz",
            "player_gesture_fix": "single-directional-drag-path-no-duplicate-gesture",
            "player_fullscreen_fix": "edge-to-edge-safe-area-cover",
            "bottom_bar_position_fix": "lower-phone-chrome",
            "side_margin_fix": "phone-5pt-edge-margins",
            "library_background_fix": "shared-animated-app-background",
            "background_animation": "seamless-blurred-circle-glows",
            "background_seam_fix": "removed-rectangular-moving-gradient-frames",
            "bottom_bar_position_adjustment": "raised-by-1pt",
            "bottom_bar_height_fix": "68-to-62pt-trimmed-from-bottom",
            "bottom_bar_content_fix": "52pt-inner-height-icons-and-labels-rescaled",
            "chrome_stack_fix": "6pt-bottom-compensation-preserves-top-edge",
            "bottom_corner_clearance": "4pt-horizontal-inset-and-2pt-up-only-on-tabbar",
            "bottom_bar_outline_fix": "matched-28pt-background-and-stroke-radius",
            "touch_interception_fix": "morph-player-disabled-at-mini-state",
            "mini_player_render_fix": "standalone-mini-player-synced-with-bottom-chrome",
            "player_alignment_fix": "shared-safe-area-and-chrome-coordinate-system",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muwa-Nasheeds-Native-IPA-${{ github.run_number }}
          path: |
            build/Muwa-Nasheeds-v1.4.0-build18-cornerclearance-unsigned.ipa
            build/Muwa-Nasheeds-v1.4.0-build18-cornerclearance-unsigned.ipa.sha256
            build/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload Xcode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Muwa-Nasheeds-build-log-${{ github.run_number }}
          path: |
            build/xcodebuild.log
            build/architecture.txt
          if-no-files-found: ignore
          retention-days: 14
