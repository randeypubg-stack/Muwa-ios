name: Review Muwa administration
on:
  push:
    branches: [main, feat/muwa-native-build35]
    paths: ["admin-panel/**", "backend/helpers/adminValidation.tsx", "backend/helpers/localRecognition.tsx", "backend/helpers/titleSuggestions.ts", "tests/AdminWorkspaceChecks.py", ".github/workflows/admin-panel-review.yml"]
  pull_request:
    paths: ["admin-panel/**", "backend/helpers/adminValidation.tsx", "backend/helpers/localRecognition.tsx", "backend/helpers/titleSuggestions.ts", "tests/AdminWorkspaceChecks.py", ".github/workflows/admin-panel-review.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-security:
    uses: ./.github/workflows/security.yml
  browser:
    needs: source-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-panel/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: admin-panel
      - run: python -m pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - name: Check real panel components with isolated HTTP fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/panel-review
          npm --prefix admin-panel run preview -- --port 4173 > build/panel-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4173/admin', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise RuntimeError('Local panel preview did not start')
          PY
          python tests/AdminWorkspaceChecks.py --output build/panel-review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-admin-panel-review-${{ github.run_id }}
          path: |
            build/panel-review
            build/panel-preview.log
          if-no-files-found: error
