name: Review native CarPlay

on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: true
      source_artifact_name:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Verified native build run ID
        type: string
        default: "37080911175"
        required: true
      source_artifact_name:
        description: Full-source artifact from that build
        type: string
        default: Muwa-Full-Source-97
        required: true
  push:
    branches: [feat/muwa-native-build35]
    paths:
      - tests/capture_carplay.py
      - tests/locate_carplay_app.swift
      - .github/workflows/review-carplay.yml

permissions:
  contents: read
  actions: read

jobs:
  source-security:
    uses: ./.github/workflows/security.yml
  capture:
    name: Review CarPlay external display
    needs: source-security
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.source_artifact_name || 'Muwa-Full-Source-97' }}
          run-id: ${{ inputs.source_run_id || '37080911175' }}
          github-token: ${{ github.token }}
          path: build/carplay-source
      - name: Build CarPlay review with Xcode simulator signing
        run: |
          SOURCE_ZIP="$(find build/carplay-source -name '*FULL-SOURCE.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d build/carplay-source/native
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import subprocess
          root = Path("build/carplay-source/native/Repository")
          folders = ["native-patches", "branding", "source-base", "scripts"]
          paths = subprocess.check_output(["git", "ls-files", "-z", *folders, "tests/prepare_previews.py"]).decode().split("\0")
          actual = {p for p in paths if p}
          expected = {str(p.relative_to(root)) for folder in folders for p in (root / folder).rglob("*") if p.is_file()}
          expected.add("tests/prepare_previews.py")
          assert actual == expected, "CarPlay fixture source differs from current application inputs"
          for name in sorted(actual):
              assert Path(name).read_bytes() == (root / name).read_bytes(), f"Stale CarPlay fixture: {name}"
          print("Verified all native inputs against the compiled source artifact")
          PY_SOURCE
          CARPLAY_SOURCE="$PWD/build/carplay-source/native/MuwaNasheedsNative"
          python3 tests/prepare_previews.py "$CARPLAY_SOURCE"
          set -o pipefail
          xcodebuild -project "$CARPLAY_SOURCE/MuwaNasheeds.xcodeproj" -scheme MuwaNasheeds -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/build/PreviewDerivedData" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= MUWA_CARPLAY_ENTITLEMENTS=MuwaCarPlay.entitlements build 2>&1 | tee build/carplay-xcodebuild.log
      - name: Require a connected Muwa CarPlay scene and native screenshot
        run: |
          if ! command -v cliclick >/dev/null; then brew install cliclick; fi
          python3 tests/capture_carplay.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Muwa-build40-CarPlay-review
          path: |
            build/previews/carplay
            build/carplay-xcodebuild.log
          if-no-files-found: warn
