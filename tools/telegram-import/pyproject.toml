[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muwa-telegram-import"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "Telethon==1.45.0"]
description = "Import Telegram audio into the existing authenticated Muwa catalogue"

[project.scripts]
muwa-telegram-import = "muwa_telegram_import.cli:main"

[tool.setuptools.packages.find]
include = ["muwa_telegram_import*"]
