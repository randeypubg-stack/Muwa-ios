# HTTP context; token query strings and cookies are never written to access logs.
log_format muwa '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=muwa_auth:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=muwa_connections:1m;
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name 93.188.187.96;
 access_log /var/log/nginx/muwa-access.log muwa;
 location ^~ /.well-known/acme-challenge/ { root /var/www/muwa-acme; }
 location / { return 308 https://93.188.187.96$request_uri; }
}
server {
 listen 443 ssl default_server;
 listen [::]:443 ssl default_server;
 server_name 93.188.187.96;
 server_tokens off;
 ssl_certificate /etc/letsencrypt/live/muwa-ip/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/muwa-ip/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log /var/log/nginx/muwa-access.log muwa;
 error_log /var/log/nginx/muwa-error.log crit;
 root /srv/muwa/current/admin-panel/dist;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Robots-Tag 'noindex, nofollow' always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 add_header Cache-Control no-store always;
 client_body_timeout 120s;
 client_max_body_size 101m;
 limit_conn muwa_connections 8;
 location = / { return 302 /admin; }
 location /admin { try_files $uri /index.html; }
 location = /index.html { try_files $uri =404; }
 location /assets/ { try_files $uri =404; }
 location ~ ^/_api/auth/(login_with_password|owner_setup)$ {
   limit_req zone=muwa_auth burst=5 nodelay;
   limit_req_status 429;
   client_max_body_size 32k;
   include /etc/nginx/muwa-proxy.conf;
 }
 location /_api/ { include /etc/nginx/muwa-proxy.conf; }
 location = /_storage/file {
   error_log /dev/null;
   proxy_request_buffering off;
   include /etc/nginx/muwa-proxy.conf;
 }
 location = /_health { include /etc/nginx/muwa-proxy.conf; }
 location / { return 404; }
}
